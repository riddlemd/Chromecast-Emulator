<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chromecast Emulator</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0d;
    color: #e8e8ea;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #stage { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; background: #000; display: none; }
  body.playing video { display: block; }

  #idle { text-align: center; opacity: .55; }
  body.playing #idle { display: none; }
  #idle h1 { margin: 0 0 .4em; font-size: 20px; font-weight: 500; letter-spacing: .02em; }
  #idle p { margin: 0; font-size: 13px; }
  #idle-title { margin-top: .6em; opacity: .8; }

  #banner {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 14px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .75));
    font-size: 13px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.playing #banner.show { opacity: 1; }

  #error {
    position: absolute; top: 12px; left: 12px; right: 12px;
    padding: 8px 12px;
    background: #3a1113; border: 1px solid #7c2529; border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  #error.show { display: block; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline></video>

  <div id="idle">
    <h1 id="idle-heading">Ready to cast</h1>
    <p id="idle-detail">Waiting for a sender to load media</p>
    <p id="idle-title"></p>
  </div>

  <div id="banner"></div>
  <div id="error"></div>
</div>

<script src="/hls.js"></script>
<script src="/player.js"></script>
</body>
</html>
